name: Release

# Push a tag like v0.2.0 to publish a GitHub release. The in-app Updates tab reads the latest one.
#   git tag v0.2.0 && git push origin v0.2.0
# For the Android app later, attach the .apk to the release (the Updates tab prefers an .apk).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the website
        run: |
          bash tools/build_site.sh _site
          (cd _site && zip -qr "../lingua-aid-web-${GITHUB_REF_NAME}.zip" .)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "lingua-aid-web-${GITHUB_REF_NAME}.zip" --generate-notes --title "Lingua Aid $GITHUB_REF_NAME"
