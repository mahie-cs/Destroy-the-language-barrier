name: Generate audio

# Makes the mp3 files in audio/ with gTTS and commits them to the repo.
# Runs when the text changes (data/**) or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "tools/generate_audio.py"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate every clip, not just new or changed ones"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gTTS
      - run: python tools/validate_data.py
      - run: python tools/generate_audio.py ${{ inputs.force && '--force' || '' }}
      - name: Commit new audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "No audio changes."
          else
            git commit -m "chore(audio): update generated audio"
            git pull --rebase origin main
            git push
          fi
